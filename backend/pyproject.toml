[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-math-tutor-backend"
version = "0.1.0"
description = "FastAPI service for the AI Mathematics Tutor (TCS academic demo)"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.2",
    "fastembed==0.9.1",
    "httpx==0.28.1",
    "openai==3.46.0",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.3",
    "pydantic-ai==2.66.0",
    "pydantic-settings==2.16.2",
    "pyjwt[crypto]==2.15.1",
    "sqlalchemy[asyncio]==2.1.8",
    "structlog==26.1.0",
    "supabase==2.34.1",
    "sympy==1.14.0",
    "uvicorn==0.54.0",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "integration: requires a live Postgres/pgvector or provider credentials",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["supabase.*"]
ignore_missing_imports = true
