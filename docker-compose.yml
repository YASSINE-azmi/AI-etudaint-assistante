services:
  postgres:
    image: pgvector/pgvector:pg16
    # Owner is `postgres`, as on Supabase. The init script adds the anon/authenticated
    # shim and the non-superuser `app_runtime` / `app_worker` roles (local passwords).
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_math_tutor
      DB_SCRIPTS_DIR: /opt/db-scripts
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts:/opt/db-scripts:ro
      - ./backend/scripts/local_db_init.sh:/docker-entrypoint-initdb.d/10-local-db-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_math_tutor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
