services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app_runtime
      POSTGRES_PASSWORD: app_runtime_password
      POSTGRES_DB: ai_math_tutor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_runtime -d ai_math_tutor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
