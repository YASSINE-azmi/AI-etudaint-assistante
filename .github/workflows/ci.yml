name: CI

on:
  push:
    branches: ['master', 'grunt']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check app tests alembic

      - name: Format check
        run: uv run ruff format --check app tests alembic

      - name: Type check
        run: uv run mypy app

      - name: Unit tests (no network / no DB)
        run: uv run python -m pytest -m "not integration"

      - name: Export locked requirements for audit
        run: uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements.txt

      - name: Audit Python dependencies
        run: uvx pip-audit -r requirements.txt

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit JS dependencies
        run: pnpm audit --audit-level high

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke
        run: pnpm test:e2e

      # Traces and screenshots (`trace: 'retain-on-failure'`) land in test-results/; the HTML
      # report links to them. Plan §13.4: capture traces on failure.
      - name: Upload Playwright traces and report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 7

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-integration:
    name: Backend integration (migrations, RLS, SSE)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        # The owner is `postgres`, as on Supabase. The API role `app_runtime` is created
        # by scripts/local_db_init.sh as a non-superuser so RLS tests are real.
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_math_tutor
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_math_tutor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create Supabase role shim and runtime roles
        run: ./scripts/local_db_init.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: ai_math_tutor

      - name: Run migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_math_tutor

      - name: Integration tests
        run: uv run python -m pytest -m "integration"
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/ai_math_tutor
          DATABASE_RUNTIME_URL: postgresql+psycopg://app_runtime:app_runtime_password@localhost:5432/ai_math_tutor

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ai-math-tutor-backend ./backend

      - name: Build frontend image
        run: docker build -t ai-math-tutor-frontend ./frontend
